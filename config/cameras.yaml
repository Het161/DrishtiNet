# DrishtiNet — camera registry seed for the Sentinel 2026 provided feeds.
#
# Generated from the portal's own /api/cameras endpoint (the authoritative list) merged with
# manually researched geography. Re-sync with:  python3 scripts/sync_registry.py
#
# ─── Two things this file deliberately does NOT do ────────────────────────────────────────────
#
# 1. It does not assert a department. The portal's /api/cameras response carries exactly these
#    fields — id, number, name, location, duration, codec, container, status, delivery, detail —
#    and NONE of them is a department. The hackathon FAQ says the dataset spans Health, Police,
#    GSRTC, Panchayat and Municipal Corporation, but only two cameras name their owner in the
#    label (17 "Rajkot Bus Port" → GSRTC, 20 "Khaparia Gram Panchayat" → Panchayat) and nothing
#    maps to Health at all. So `department` is `unassigned` everywhere and the human guess lives
#    in `department_guess` for reference only. The registry UI shows "Unassigned" — a registry
#    that admits what it does not know is more credible to SCRB than one that guesses.
#
# 2. It does not pretend the coordinates are surveyed. `geo_confidence` is one of:
#      high     — a specific, identifiable junction
#      approx   — correct town/area, junction-level position estimated
#      geocode  — unresolved; run scripts/geocode.py (online, manual) or fix by hand
#    Anything still `geocode` renders on the map as a hollow marker in a district centroid with an
#    explicit "position unverified" flag rather than a confident dot in the wrong place.
#
# ─── Timeline semantics (see data/probe/REPORT.md) ───────────────────────────────────────
# These are NOT live cameras. Each is a long recording served as progressive MP4 over HTTP range.
# The portal fakes "live" purely client-side: playback position = (slot_offset + elapsed) mod
# slot_seconds, then mod file duration. slot_seconds = 43200 (12 h) and slots begin at 09:00 and
# 21:00 IST. Our stream-gateway reproduces exactly this arithmetic server-side.

meta:
  source: https://live.sentinelgujarat.in
  list_api: /api/cameras
  state_api: /api/cameras/{id}/state
  stream_path: /stream/{id}
  discovered_at: '2026-08-20T20:52:00+05:30'
  camera_count: 31
  # From /api/cameras/{id}/state — identical across every camera we sampled.
  slot_seconds: 43200
  slot_boundaries_ist: ['09:00:00', '21:00:00']
  timezone: Asia/Kolkata
  loop: true
  drift_tolerance_s: 5.0
  # Label numbers 21,22,24,25,26,27,29,31,32 are absent: the original deployment was larger than
  # what is currently published. The FAQ's "~50" and today's 31 will not match. Expect churn.
  missing_label_numbers: [21, 22, 24, 25, 26, 27, 29, 31, 32]
  last_synced: '2026-08-20T21:14:48+05:30'


# DrishtiNet — one-command, fully offline stack.
#
#   docker compose -f infra/docker-compose.yml --profile full up -d
#
# Profiles:
#   (default)  postgres + redis + minio + mediamtx — the backing services, for local dev
#   full       everything, including the application containers — the demo-day path
#
# OFFLINE NOTE: every image below must be pulled at least once while online.
# Run `scripts/preflight-offline.sh` before travelling to the venue.

name: drishtinet

services:
  postgres:
    # Canonical upstream image is amd64-only. On Apple Silicon that means QEMU emulation, so
    # POSTGRES_IMAGE lets the demo laptop use the multi-arch community rebuild of the same
    # Dockerfile and run native. See .env.example.
    image: ${POSTGRES_IMAGE:-postgis/postgis:16-3.4}
    container_name: drishti-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-drishti}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-drishti_dev_only}
      POSTGRES_DB: ${POSTGRES_DB:-drishtinet}
      # Deterministic timestamps everywhere. See packages/shared/src/time.ts.
      TZ: Asia/Kolkata
      PGTZ: Asia/Kolkata
    ports:
      - '${POSTGRES_PORT:-5433}:5432'
    volumes:
      # POSTGRES_DATA_MOUNT is chosen by measurement, not preference — see README.md.
      # macOS bind mounts are fsync-hostile and Postgres is fsync-heavy.
      - ${POSTGRES_DATA_MOUNT:-../data/postgres}:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-drishti} -d ${POSTGRES_DB:-drishtinet}']
      interval: 5s
      timeout: 5s
      retries: 20
    networks: [drishti]

  redis:
    image: redis:7-alpine
    container_name: drishti-redis
    restart: unless-stopped
    # Streams are the event bus; AOF keeps the demo reproducible across a restart.
    command: ['redis-server', '--appendonly', 'yes', '--save', '60', '1']
    ports:
      - '${REDIS_PORT:-6380}:6379'
    volumes:
      - ../data/redis:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [drishti]

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    container_name: drishti-minio
    restart: unless-stopped
    command: ['server', '/data', '--console-address', ':9001']
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-drishti}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-drishti_dev_only}
    ports:
      - '${MINIO_PORT:-9000}:9000'
      - '${MINIO_CONSOLE_PORT:-9001}:9001'
    volumes:
      - ../data/minio:/data
    healthcheck:
      test: ['CMD', 'mc', 'ready', 'local']
      interval: 5s
      timeout: 5s
      retries: 20
    networks: [drishti]

  # Creates the evidence bucket and locks it down, then exits. Idempotent.
  minio-init:
    image: minio/mc:RELEASE.2025-04-16T18-13-26Z
    container_name: drishti-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 ${MINIO_ROOT_USER:-drishti} ${MINIO_ROOT_PASSWORD:-drishti_dev_only} &&
      mc mb --ignore-existing local/${S3_BUCKET:-drishtinet-evidence} &&
      mc anonymous set none local/${S3_BUCKET:-drishtinet-evidence} &&
      echo 'minio ready: bucket ${S3_BUCKET:-drishtinet-evidence} (private)'
      "
    networks: [drishti]

  mediamtx:
    image: bluenviron/mediamtx:1.11.3
    container_name: drishti-mediamtx
    restart: unless-stopped
    environment:
      MTX_PROTOCOLS: tcp
    ports:
      - '${MEDIAMTX_RTSP_PORT:-8554}:8554'      # RTSP in/out
      - '${MEDIAMTX_WEBRTC_PORT:-8889}:8889'    # WebRTC (WHEP) — the browser path
      - '${MEDIAMTX_HLS_PORT:-8888}:8888'       # LL-HLS fallback
      - '${MEDIAMTX_API_PORT:-9997}:9997'       # control API, used by stream-gateway
      - '${MEDIAMTX_PLAYBACK_PORT:-9996}:9996'  # playback API — evidence clips are cut from here
      - '8890:8890/udp'                          # SRT
      - '8189:8189/udp'                          # WebRTC ICE/UDP
    volumes:
      - ../services/stream-gateway/mediamtx.yml:/mediamtx.yml:ro
      - ../services/stream-gateway/media:/media:ro
      # The evidence ring buffer. Retention is enforced by MediaMTX (recordDeleteAfter).
      - ../data/ring:/ring
    networks: [drishti]

  # ----------------------------------------------------------------------------
  # Application containers (profile: full)
  # ----------------------------------------------------------------------------

  stream-gateway:
    profiles: [full]
    build:
      context: ..
      dockerfile: services/stream-gateway/Dockerfile
    container_name: drishti-stream-gateway
    restart: unless-stopped
    env_file: [../.env]
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-drishti}:${POSTGRES_PASSWORD:-drishti_dev_only}@postgres:5432/${POSTGRES_DB:-drishtinet}?schema=public
      MEDIAMTX_API_URL: http://mediamtx:9997
      MEDIAMTX_RTSP_HOST: mediamtx
      REDIS_URL: redis://redis:6379
    ports:
      - '${STREAM_GATEWAY_PORT:-4001}:4001'
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    networks: [drishti]

  analytics:
    profiles: [full]
    build:
      context: ..
      dockerfile: services/analytics/Dockerfile
    container_name: drishti-analytics
    restart: unless-stopped
    env_file: [../.env]
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-drishti}:${POSTGRES_PASSWORD:-drishti_dev_only}@postgres:5432/${POSTGRES_DB:-drishtinet}
      REDIS_URL: redis://redis:6379
      S3_ENDPOINT: http://minio:9000
      STREAM_GATEWAY_URL: http://stream-gateway:4001
    ports:
      - '${ANALYTICS_PORT:-8001}:8001'
    volumes:
      # Weights live in the repo and are mounted read-only; nothing is ever downloaded to $HOME
      # and nothing is written outside the repository.
      - ../models:/app/models
      - ../.cache:/app/.cache
      - ../data:/app/data
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    networks: [drishti]

  alerts:
    profiles: [full]
    build:
      context: ..
      dockerfile: services/alerts/Dockerfile
    container_name: drishti-alerts
    restart: unless-stopped
    env_file: [../.env]
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-drishti}:${POSTGRES_PASSWORD:-drishti_dev_only}@postgres:5432/${POSTGRES_DB:-drishtinet}?schema=public
      REDIS_URL: redis://redis:6379
      S3_ENDPOINT: http://minio:9000
      INTEGRATIONS_URL: http://integrations:4003
    ports:
      - '${ALERTS_PORT:-4002}:4002'
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    networks: [drishti]

  integrations:
    profiles: [full]
    build:
      context: ..
      dockerfile: services/integrations/Dockerfile
    container_name: drishti-integrations
    restart: unless-stopped
    env_file: [../.env]
    ports:
      - '${INTEGRATIONS_PORT:-4003}:4003'
    networks: [drishti]

  web:
    profiles: [full]
    build:
      context: ..
      dockerfile: apps/web/Dockerfile
      args:
        # These are inlined into the client bundle at build time, so they must be the URLs the
        # *browser* will use (host-side ports), not the in-network service names.
        NEXT_PUBLIC_ALERTS_WS_URL: ${NEXT_PUBLIC_ALERTS_WS_URL:-ws://localhost:4002/ws}
        NEXT_PUBLIC_STREAM_GATEWAY_URL: ${NEXT_PUBLIC_STREAM_GATEWAY_URL:-http://localhost:4001}
        NEXT_PUBLIC_WEBRTC_BASE_URL: ${NEXT_PUBLIC_WEBRTC_BASE_URL:-http://localhost:8889}
    container_name: drishti-web
    restart: unless-stopped
    env_file: [../.env]
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-drishti}:${POSTGRES_PASSWORD:-drishti_dev_only}@postgres:5432/${POSTGRES_DB:-drishtinet}?schema=public
      REDIS_URL: redis://redis:6379
      S3_ENDPOINT: http://minio:9000
      ALERTS_URL: http://alerts:4002
      INTEGRATIONS_URL: http://integrations:4003
      STREAM_GATEWAY_URL: http://stream-gateway:4001
    ports:
      - '${WEB_PORT:-3000}:3000'
    depends_on:
      postgres: { condition: service_healthy }
    networks: [drishti]

volumes:
  # Declared so POSTGRES_DATA_MOUNT can name it when a bind mount is too slow (see README.md).
  postgres-data:

networks:
  drishti:
    driver: bridge
